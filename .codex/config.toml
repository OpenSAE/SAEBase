# 目的和主要功能：选择本项目客户端权限与开发工具设置。
# 适用范围：模式切换同步管理字段；客户端在会话启动或重新加载时读取。
# Requires Codex >= 0.153.0; the project mode selects the active permissions.
default_permissions = ":danger-full-access"
approval_policy = "never"
project_doc_max_bytes = 65536

[features]
hooks = true

# 常规模式使用以下 saebase 配置；密集模式选用上方的完整访问配置。
[permissions.saebase.filesystem]
":minimal" = "read"

[permissions.saebase.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".codex" = "write"
".agents" = "read"
".github" = "read"
"harness" = "read"
".researchharness" = "read"
"doc" = "write"
"atlas" = "read"
"saebase/runtime" = "read"
"AGENTS.md" = "read"
"datasets/AGENTS.md" = "read"
"models/AGENTS.md" = "read"
"tasks/AGENTS.md" = "read"
"saebase/AGENTS.md" = "read"

[permissions.saebase.network]
enabled = false
