[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensae-saebase"
version = "0.6.5"
description = "Research infrastructure for sparse autoencoder evaluation and interventions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["sparse autoencoder", "mechanistic interpretability", "sae", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lightweight offline API and registration; real checkpoint downloads are opt-in.
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
analysis = [
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
]
# QA500 answer equivalence scorer.
qa-eval = ["math-verify[antlr4_9_3]==0.9.0", "PyYAML>=6"]

generation = [
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
    "vllm==0.27.1",
    "nnsight[vllm]==0.8.0rc1",
]
# Separate optional workers. Do not co-install every research backend by default.
tl4 = [
    "transformer-lens>=4.0,<5",
    "sae-lens>=6.0,<7",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
]
nnsight-local = ["nnsight>=0.8,<0.9"]
dev = ["pytest>=7", "build>=1.2", "twine>=5", "PyYAML>=6", "pytest-cov>=5,<8"]
quality = ["ruff>=0.12,<0.16", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[project.scripts]
saebase = "saebase.cli:main"
saebase-prepare-prompts = "saebase.cli:prepare_prompts"
saebase-check-env = "saebase.cli:check_env"
saebase-intervene = "saebase.cli:intervene"
saebase-benchmark = "saebase.cli:benchmark"
saebase-audit = "saebase.cli:audit"
saebase-ground-truth = "saebase.cli:ground_truth"
saebase-release-matrix = "saebase.cli:release_matrix"
saebase-release-gate = "saebase.cli:release_gate"

[project.urls]
Repository = "https://github.com/OpenSAE/SAEBase"
Organization = "https://github.com/OpenSAE"
Issues = "https://github.com/OpenSAE/SAEBase/issues"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["saebase*", "models*", "tasks*", "conf*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
conf = ["**/*.yaml", "**/*.yml", "**/*.md", "**/*.json"]
saebase = ["**/*.md", "**/*.yaml", "**/*.json", "**/*.html", "**/*.css", "**/*.js"]
models = ["**/*.json", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["harness/github/work_test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

# Original Stage D evidence is published separately as a checksum-verified
# GitHub Evidence Release; keep configs in the wheel, not experiment records.
[tool.setuptools.exclude-package-data]
conf = ["coverage/stage_d_evidence/*", "coverage/stage_d_evidence/**/*"]
