[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensae-saebase"
version = "0.2.0"
description = "Research infrastructure for sparse autoencoder evaluation and interventions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["sparse autoencoder", "mechanistic interpretability", "sae", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lightweight offline API and registration; real checkpoint downloads are opt-in.
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
analysis = [
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
]
generation = [
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
    "vllm==0.27.1",
    "nnsight[vllm]==0.8.0rc1",
]
dev = ["pytest>=7", "build>=1.2", "twine>=5", "PyYAML>=6"]

[project.scripts]
saebase = "main:main"
saebase-prepare-prompts = "scripts.sae_prepare_prompts:main"
saebase-check-env = "scripts.check_env:main"
saebase-intervene = "scripts.m2_batch:main"
saebase-benchmark = "scripts.m3_benchmark:main"
saebase-audit = "scripts.m4_reliability:main"
saebase-ground-truth = "scripts.m4_ground_truth:main"
saebase-release-matrix = "scripts.m5_release_matrix:main"
saebase-release-gate = "scripts.m5_release_gate:main"

[project.urls]
Repository = "https://github.com/OpenSAE/SAEBase"
Organization = "https://github.com/OpenSAE"
Issues = "https://github.com/OpenSAE/SAEBase/issues"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["saebase*", "models*", "tasks*", "scripts*", "conf*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
conf = ["**/*.yaml", "**/*.yml", "**/*.md", "**/*.json"]
saebase = ["**/*.md", "**/*.yaml", "**/*.json"]
models = ["**/*.json", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
