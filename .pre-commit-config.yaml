# Purpose and main function: to check actual changes when submitting Python File.
# Scope of application: installation pre-commit then check by format and type of document range.
repos:
  - repo: local
    hooks:
      - id: synchronize-conf-doc
        name: Validate configuration paths and update doc/conf.md
        entry: python -m scripts.documentation conf --write
        language: system
        pass_filenames: false
        always_run: true
      - id: check-conf
        name: Check configuration structure, keys and documentation
        entry: python -m pytest -q -p no:cacheprovider tests/test_configuration.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-adopted
        name: Ruff on adopted core modules
        entry: ruff check
        language: system
        files: ^(saebase/seed\.py|datasets/artifacts\.py|tasks/benchmark/backend/registry\.py)$
      - id: mypy-adopted
        name: Mypy on adopted core modules
        entry: mypy --config-file pyproject.toml
        language: system
        files: ^(saebase/seed\.py|datasets/artifacts\.py|tasks/benchmark/backend/registry\.py)$
      - id: ruff-new
        name: Autoformat staged new Python with pinned Ruff, then check lint
        entry: python scripts/quality.py --fix
        language: system
        pass_filenames: false
        always_run: true
