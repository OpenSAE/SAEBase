<body data-atlas-view="core">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="https://github.com/OpenSAE/SAEBase" title="SAEBase project"><span class="brand-mark" aria-hidden="true">◈</span>SAEBase <span class="brand-light">/ Atlas</span></a>
      <nav class="tabs" aria-label="Atlas views">
        <a class="tab active" data-graph="core" href="core.html">Core</a>
        <a class="tab" data-graph="knowledge" href="knowledge.html">Knowledge</a>
        <a class="tab" data-graph="code" href="code.html">Code</a>
        <a class="tab" data-graph="environment" href="environment.html">Environment</a>
        <a class="tab" data-graph="context" href="context.html">Context</a>
      </nav>
      <div class="atlas-language-switch" id="atlasLanguageSwitch" role="group" aria-label="Atlas language"><button type="button" data-lang="zh" aria-pressed="false">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div>
      <a class="guide-link" href="https://github.com/OpenSAE/SAEBase/blob/main/harness/visualization/README.md">Guide ↗</a>
    </header>
    <div class="workspace">
      <div class="toolbar">
        <div class="navigation">
          <button id="overviewBack" class="overview-back" title="Return to the full tree" aria-label="Return to overview">← <span>Overview</span></button>
          <div id="breadcrumb" class="breadcrumb" aria-label="Current node path"></div>
          <div id="atlasChildPager" class="child-pager is-hidden" role="group" aria-label="Pages of actual source children">
            <button type="button" id="atlasChildPrev" aria-label="Previous child page">‹</button>
            <span id="atlasChildCount" aria-live="polite"></span>
            <button type="button" id="atlasChildNext" aria-label="Next child page">›</button>
          </div>
        </div>
        <div class="tool-actions">
          <label class="search-box"><span class="search-symbol" aria-hidden="true">⌕</span><input type="search" id="search" placeholder="Find a node…" aria-label="Find a node" autocomplete="off"></label>
          <button class="icon-button" id="outlineToggle" aria-label="Toggle outline" title="Outline"><span aria-hidden="true">☷</span></button>
          <button class="icon-button" id="detailsToggle" aria-label="Show node details and links" title="Details">Details</button>
          <span class="toolbar-separator" aria-hidden="true"></span>
          <button class="icon-button" id="collapse" aria-label="Collapse tree" title="Collapse tree">−</button>
          <button class="icon-button" id="expand" aria-label="Expand tree" title="Expand tree">+</button>
          <button class="icon-button" id="fit" aria-label="Fit visible tree" title="Fit visible tree">Fit</button>
          <button class="icon-button" id="zoomOut" aria-label="Zoom out" title="Zoom out">⌁</button>
          <span id="zoomValue" class="zoom-value">100%</span>
          <button class="icon-button" id="zoomIn" aria-label="Zoom in" title="Zoom in">⌃</button>
        </div>
      </div>
      <div class="visual-stage">
        <aside id="sidebar" class="sidebar is-hidden" aria-label="Project tree outline">
          <div class="drawer-top"><span>Outline</span><button id="outlineClose" aria-label="Close outline">×</button></div>
          <div id="outline" class="outline" role="tree"></div>
        </aside>
        <main class="graph-panel">
          <div id="canvasWrap" class="canvas-wrap" aria-label="Interactive node graph" tabindex="0">
            <svg id="diagram" role="img" aria-label="Source-backed expandable project tree"></svg>
          </div>
          <div id="atlasReviewBar" class="atlas-review-bar is-hidden" role="group" aria-label="Review nodes">
            <div id="atlasReviewCategory" class="review-category">
              <button id="atlasReviewFilter" class="review-filter" type="button" aria-expanded="false" aria-controls="atlasReviewMenu" title="Review category: All / Tree / Parent / Node">
                <span id="atlasReviewFilterLabel" class="review-filter-label">All</span>
                <span id="atlasReviewFilterRing" class="review-filter-progress"></span>
                <span class="review-filter-caret" aria-hidden="true">⌄</span>
              </button>
              <div id="atlasReviewMenu" class="review-menu is-hidden" role="tree" aria-label="Select review Tree, parent and child node"></div>
            </div>
            <div class="review-nav">
              <button id="atlasReviewPrevUnchecked" class="review-arrow review-skip" aria-label="Previous unchecked node" title="Previous unchecked · ←">«</button>
              <button id="atlasReviewPrev" class="review-arrow" aria-label="Previous node (force)" title="Previous any · Shift+←">‹</button>
              <span id="atlasReviewCount" class="review-count">1 / 1</span>
              <button id="atlasReviewNext" class="review-arrow" aria-label="Next node (force)" title="Next any · Shift+→">›</button>
              <button id="atlasReviewNextUnchecked" class="review-arrow review-skip" aria-label="Next unchecked node" title="Next unchecked · →">»</button>
            </div>
            <div class="review-decisions">
              <button id="atlasReviewApprove" class="review-approve" title="Approve · Enter">Approve <kbd>↵</kbd></button>
              <button id="atlasReviewDeny" class="review-deny" title="Deny · Backspace">Deny <kbd>⌫</kbd></button>
              <button id="atlasReviewUnchecked" class="review-unchecked" title="Reset to Unchecked · U">Unchecked <kbd>U</kbd></button>
            </div>
            <span id="atlasReviewMessage" class="review-message" aria-live="polite">Unchecked</span>
            <a id="atlasReviewSendReport" class="review-send-report is-hidden" href="#" target="_blank" rel="noopener noreferrer" aria-label="Send report" title="Send report">Send report</a>
          </div>
          <div class="status-legend" id="statusLegend" role="note" aria-label="Node status colors: Not Implemented red, Partial yellow, Implemented green">
            <span class="legend-item"><i class="legend-swatch not-implemented" aria-hidden="true"></i>Not Implemented</span>
            <span class="legend-item"><i class="legend-swatch partial" aria-hidden="true"></i>Partial</span>
            <span class="legend-item"><i class="legend-swatch implemented" aria-hidden="true"></i>Implemented</span>
          </div>
          <div class="canvas-foot">
            <span id="focusHint"></span>
            <label class="import-diff" id="diffControl">Compare code changes<input id="diffFile" type="file" accept=".json,application/json"></label>
          </div>
        </main>
        <aside id="detailDrawer" class="detail is-hidden" aria-label="Detailed source and relationships">
          <div class="drawer-top"><span>Context</span><button id="detailsClose" aria-label="Close details">×</button></div>
          <div id="detailBody" class="detail-body"></div>
        </aside>
      </div>
    </div>
  </div>
</body>
