# Purpose: publish SAEBase distributions alongside the corresponding source tag.
# Scope: version changes on OpenSAE/SAEBase main.
name: Publish SAEBase release
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
permissions:
  contents: read
concurrency:
  group: saebase-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'OpenSAE/SAEBase'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and publish the changed version
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          previous=$(git show "$PREVIOUS_SHA:pyproject.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          if [ "$version" = "$previous" ]; then exit 0; fi
          command -v uv >/dev/null || pipx install uv
          uv build --python 3.12 --out-dir "$RUNNER_TEMP/saebase"
          cd "$RUNNER_TEMP/saebase"
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          gh release create "v$version" *.whl *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SAEBase $version" \
            --notes "Install the published wheel or source distribution from this release."
