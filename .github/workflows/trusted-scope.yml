name: Historical Trusted Candidate Scope
permissions:
  contents: read
  pull-requests: read
jobs:
  trusted-scope:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'wp19/') || startsWith(github.event.pull_request.head.ref, 'wp20/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Reject retired examination execution
      run: |-
        echo "BLOCKED: Archived candidate approvals belong to the archived engine. Replay requires central historical isolation; current execution requires a fresh central Flow." >&2
        exit 1
'on':
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
