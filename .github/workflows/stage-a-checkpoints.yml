name: Stage A real public checkpoint acceptance

on:
  pull_request:
    paths:
      - 'saebase/coverage/**'
      - 'saebase/sae/qwen_topk.py'
      - 'saebase/sae/loading.py'
      - 'saebase/sae/registry.py'
      - 'models/hf_hooks_backend.py'
      - 'models/hf_logits_backend.py'
      - 'models/qwen35_2b/**'
      - 'scripts/stage_a_matrix.py'
      - 'tests/test_stage_a.py'
      - '.github/workflows/stage-a-checkpoints.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Model key to load and validate against actual weights
        type: choice
        required: true
        options:
          - gemma270m
          - gemma1b
          - gemma2_2b_base
          - qwen35_2b
          - qwen3_8b
          - llama31_8b
      use_gpu_runner:
        description: Use an authorized self-hosted GPU runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  public-qwen-2b-cpu:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: ${{ runner.temp }}/stage-a-hf-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real public Qwen3.5 model and SAE loader
        run: |
          python -m pip install -e ".[stage-a,dev]"
          python -m pip check
      - name: Reject registry-only acceptance
        run: |
          saebase-stage-a --dry-run --target qwen35_2b
          python -m pytest -q tests/test_stage_a.py
      - name: Download and verify the actual 2B public weights
        run: |
          saebase-stage-a --real --target qwen35_2b --device cpu --output "$RUNNER_TEMP/stage-a"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from saebase.coverage.stage_a import read_evidence
          path=Path(os.environ["RUNNER_TEMP"])/"stage-a"/"qwen35_2b.json"
          record=read_evidence(path)
          assert record["status"]=="real_weights_verified"
          assert len(record["model_sha256"])==len(record["sae_sha256"])==64
          assert record["evidence"]["backend"]=="hf_hooks"
          assert record["evidence"]["n_reference_prompts"]>=2
          print("Stage A Qwen3.5 2B real model-SAE acceptance passed")
          PY
      - name: Save real source evidence without weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-qwen35-2b-evidence
          path: ${{ runner.temp }}/stage-a/*.json
          if-no-files-found: warn
          retention-days: 30

  manual-real-checkpoint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.use_gpu_runner && fromJSON('["self-hosted","linux","gpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install model and SAE dependencies
        run: |
          python -m pip install -e ".[stage-a,dev]"
          if [[ "${{ inputs.target }}" == gemma* || "${{ inputs.target }}" == llama* ]]; then
            python -m pip install sae-lens
          fi
          python -m pip check
      - name: Run one full real-checkpoint acceptance
        run: |
          DEVICE=cpu
          if [[ "${{ inputs.use_gpu_runner }}" == true ]]; then DEVICE=cuda; fi
          saebase-stage-a --real --target "${{ inputs.target }}" --device "$DEVICE" --output "$RUNNER_TEMP/stage-a"
      - name: Save checkpoint evidence without redistributing weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-manual-${{ inputs.target }}
          path: ${{ runner.temp }}/stage-a/*.json
          if-no-files-found: warn
          retention-days: 30
