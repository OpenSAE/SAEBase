name: One-time new-layout Python formatting
on:
  push:
    branches: [refactor-openresearch-architecture-20261027]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-openresearch-architecture-20261027
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Annotate compatibility forwarding imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("saebase/data").rglob("*.py"):
              content = path.read_text(encoding="utf-8")
              if "Legacy import forwarding" not in content:
                  continue
              content = content.replace("def __getattr__(name):", "def __getattr__(name: str) -> object:")
              content = content.replace("def __dir__():", "def __dir__() -> list[str]:")
              path.write_text(content, encoding="utf-8")
          PY
      - name: Repair relocated imports and project roots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("saebase/tools").glob("*.py"):
              old = path.read_text(encoding="utf-8")
              new = old.replace("Path(__file__).resolve().parents[1]", "Path(__file__).resolve().parents[2]")
              new = new.replace('root / "docs"', 'root / "harness/github_development_doc"')
              new = new.replace('root / "examples"', 'root / "saebase/examples"')
              new = new.replace('ROOT / "docs"', 'ROOT / "harness/github_development_doc"')
              new = new.replace('ROOT / "examples"', 'ROOT / "saebase/examples"')
              if new != old:
                  path.write_text(new, encoding="utf-8")
          for path in Path("saebase/examples").rglob("*.py"):
              old = path.read_text(encoding="utf-8")
              new = old.replace("Path(__file__).resolve().parents[2]", "Path(__file__).resolve().parents[3]")
              if new != old:
                  path.write_text(new, encoding="utf-8")
          for root in ("saebase", "tasks", "models", "tests", "harness", "doc", "datasets"):
              for path in Path(root).rglob("*.py"):
                  old = path.read_text(encoding="utf-8")
                  new = old.replace("saebase.saebase.", "saebase.")
                  if new != old:
                      path.write_text(new, encoding="utf-8")
          for name in ("doc/knowledge/atlas_terms.json", "doc/code/code_annotations.json",
                       "harness/core/project_graph.json", "harness/visualization/evidence.py"):
              path = Path(name)
              old = path.read_text(encoding="utf-8")
              new = (old.replace("tasks/runner.py", "saebase/runner.py")
                        .replace("saebase/runtime/registry.py", "saebase/registry.py")
                        .replace("tasks.runner", "saebase.runner"))
              if new != old:
                  path.write_text(new, encoding="utf-8")
          PY
      - name: Format modified Python and repair safe lint problems
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff>=0.12,<0.16"
          git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.py' | xargs -0 -r ruff check --fix || true
          git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.py' | xargs -0 -r ruff format
      - name: Commit reformatted modules
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: repair project-root paths and migrated imports"
          git push origin HEAD:refactor-openresearch-architecture-20261027
