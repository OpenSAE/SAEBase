name: Real Pythia Smoke Acceptance (manual)

# M0/M1/M2 original acceptance merged from three opt-in commit-marker workflows.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Real CPU acceptance suite
        required: true
        type: choice
        options: [m0, m1, m2, all]
        default: m0

permissions:
  contents: read

jobs:
  real-smoke:
    name: Real CPU acceptance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["m0","m1","m2"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install checkpoint-capable analysis runtime
        run: |
          python -m pip install -e ".[analysis]"
          python -m pip check
          saebase-check-env --mode analysis
      - name: Require frozen M0 reference for M1/M2
        if: matrix.suite != 'm0'
        run: test -f tests/fixtures/m0_reference_public.json
      - name: Run original real-checkpoint acceptance
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            m0)
              DEVICE=cpu N_GENERATE=120 MIN_KEPT=5 N_PROMPTS=3 \
                OUT_DIR="$RUNNER_TEMP/saebase-m0" \
                DATA_DIR="$RUNNER_TEMP/saebase-m0/data" \
                bash scripts/m0_real_smoke.sh
              ;;
            m1)
              python scripts/m1_real_smoke.py \
                --m0-reference tests/fixtures/m0_reference_public.json \
                --cache-root "$RUNNER_TEMP/m1-store" \
                --output "$RUNNER_TEMP/m1-results/m1_reference.json"
              ;;
            m2)
              python scripts/m2_real_smoke.py \
                --m0-reference tests/fixtures/m0_reference_public.json \
                --cache-root "$RUNNER_TEMP/m2-cache" \
                --output "$RUNNER_TEMP/m2-results/m2_reference.json"
              ;;
            *)
              echo "Unknown acceptance suite" >&2
              exit 2
              ;;
          esac
      - name: Preserve M0 real checkpoint evidence
        if: always() && matrix.suite == 'm0'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m0-reference
          path: ${{ runner.temp }}/saebase-m0/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve M1 real cache evidence
        if: always() && matrix.suite == 'm1'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m1-reference
          path: ${{ runner.temp }}/m1-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve M2 real intervention evidence
        if: always() && matrix.suite == 'm2'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m2-reference
          path: ${{ runner.temp }}/m2-results/
          if-no-files-found: warn
          retention-days: 14
