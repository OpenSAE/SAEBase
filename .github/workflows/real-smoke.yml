name: Real Pythia Smoke Acceptance (manual)

# Explicit reference, activation-cache and intervention acceptance suites.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Real CPU acceptance suite
        required: true
        type: choice
        options: [reference, activation-cache, interventions, all]
        default: reference

permissions:
  contents: read

jobs:
  real-smoke:
    name: Real CPU acceptance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["reference","activation-cache","interventions"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install checkpoint-capable analysis runtime
        run: |
          python -m pip install -e ".[analysis,dev]"
          python -m pip check
          saebase-check-env --mode analysis
      - name: Require frozen checkpoint reference for activation caches and intervention measurements
        if: matrix.suite != 'reference'
        run: test -f tests/product/fixtures/m0_reference_public.json
      - name: Run original real-checkpoint acceptance
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            reference)
              python -m saebase.api.reference --device cpu \
                --n-generate 120 --min-kept 5 --n-prompts 3 \
                --data-dir "$RUNNER_TEMP/saebase-reference/data" \
                --output "$RUNNER_TEMP/saebase-reference/checkpoint_reference.json"
              ;;
            activation-cache)
              python -m tests.product.test_activation_store \
                --reference tests/product/fixtures/m0_reference_public.json \
                --cache-root "$RUNNER_TEMP/activation-cache-store" \
                --output "$RUNNER_TEMP/activation-cache-results/activation_cache.json"
              ;;
            interventions)
              python -m tests.product.test_feature_interventions \
                --reference tests/product/fixtures/m0_reference_public.json \
                --cache-root "$RUNNER_TEMP/interventions-cache" \
                --output "$RUNNER_TEMP/interventions-results/intervention_measurements.json"
              ;;
            *)
              echo "Unknown acceptance suite" >&2
              exit 2
              ;;
          esac
      - name: Preserve real checkpoint reference evidence
        if: always() && matrix.suite == 'reference'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-checkpoint-reference
          path: ${{ runner.temp }}/saebase-reference/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve real activation-cache evidence
        if: always() && matrix.suite == 'activation-cache'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-activation-cache-reference
          path: ${{ runner.temp }}/activation-cache-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve real intervention evidence
        if: always() && matrix.suite == 'interventions'
        uses: actions/upload-artifact@v4
        with:
          name: saebase-interventions-reference
          path: ${{ runner.temp }}/interventions-results/
          if-no-files-found: warn
          retention-days: 14
