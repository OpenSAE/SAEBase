name: Verify centrally published Atlas snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing central publication without rebuilding
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          record = json.loads(Path("atlas/publication.json").read_text())
          assert record["project_id"] == "saebase" and record["status"] == "reviewed"
          PYTHON
          cd atlas
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centrally-published-atlas
          path: atlas/
