name: M4 original SAR RSS synthetic truth and discriminability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'saebase/reliability/**'
      - 'tests/test_m4_ground_truth.py'
      - 'scripts/m4_ground_truth.py'
      - '.github/workflows/m4-ground-truth.yml'

permissions:
  contents: read

jobs:
  ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpenSAE/SAE-Behavioral-Compositionality
          ref: c253dca303437318c1f4f4937557ac9d22143b19
          path: originals/sar
      - uses: actions/checkout@v7
        with:
          repository: OpenSAE/Redistribution-Sensitivity-Score
          ref: 0b321851e7b79564bf72656e1dbcaaca513048d8
          path: originals/rss
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install SAEBase for independent synthetic tests
        run: python -m pip install -e '.[dev]'
      - name: Check original estimators and synthetic truth
        env:
          SAEBASE_SAR_SOURCE: originals/sar/sar.py
          SAEBASE_RSS_SOURCE: originals/rss/rss.py
        run: |
          python -m pytest -q tests/test_m4_ground_truth.py
          saebase-ground-truth --config conf/reliability/m4_ground_truth.json \
            --sar-source originals/sar/sar.py \
            --rss-source originals/rss/rss.py \
            --output "$RUNNER_TEMP/ground-truth.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          record=json.loads((Path(os.environ["RUNNER_TEMP"])/"ground-truth.json").read_text())
          assert record["status"]=="passed",record
          assert len(record["factor_cases"])==4
          assert len(record["known_interaction_cases"])==3
          assert record["known_rss_direction_case"]["status"]=="passed"
          assert len(record["negative_invariance_controls"])==3
          print("M4 native SAR/RSS scientific validity and controls passed")
          PY
      - name: Archive synthetic ground truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m4-ground-truth-report
          path: ${{ runner.temp }}/ground-truth.json
          if-no-files-found: warn
          retention-days: 14
