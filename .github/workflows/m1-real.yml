name: Real M1 activation cache acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m1-pythia:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m1-real]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -e '.[analysis]'
      - name: Check pinned real M0 reference fixture
        run: test -f tests/fixtures/m0_reference_public.json
      - name: Capture and verify real pretrained Pythia + SAE cache
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/m1_real_smoke.py \
            --m0-reference tests/fixtures/m0_reference_public.json \
            --cache-root "$RUNNER_TEMP/m1-store" \
            --output "$RUNNER_TEMP/m1-results/m1_reference.json"
      - name: Upload numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m1-reference
          path: ${{ runner.temp }}/m1-results/
          if-no-files-found: warn
          retention-days: 14
