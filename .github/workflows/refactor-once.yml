name: One-time SAEBase architecture refactor
on:
  push:
    branches: [refactor-openresearch-architecture-20261027]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message != 'refactor: apply one-time architecture migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-openresearch-architecture-20261027
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply complete source reorganization
        run: python harness/refactor_once.py
      - name: Compile relocated Python source
        run: python -m compileall -q saebase models tasks
      - name: Commit the integrated architecture
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: apply one-time architecture migration"
          git push origin HEAD:refactor-openresearch-architecture-20261027
