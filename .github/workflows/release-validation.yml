# 目的和主要功能：验证指定源码提交的软件功能、安装与发布产物。
# 适用范围：明确选择当前 main 提交的手动发布验证任务。
name: Release Validation
permissions:
  contents: read
concurrency:
  group: release-validation-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  source-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
    - name: Verify selected SHA is exactly current main
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
        echo "Release Validation for exact source $SOURCE_SHA"
  hydra-composition:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install CPU configuration dependencies
      run: python -m pip install -e ".[dev]" "pytorch-lightning>=2.1,<3" "torchvision>=0.15"
    - name: Compose SAE capture defaults without launching model
      run: python -m saebase.runtime.train --cfg job
    - name: Compose alternate SAE benchmark without model weights
      run: python -m saebase.runtime.train dataset=ioi model=openresearch_gemma2_2b_base task=benchmark --cfg job
  harness-source:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install local integration test dependencies
      run: python -m pip install -e ".[dev]"
    - name: Check local integration adapters without rebuilding Atlas
      run: |-
        python -m pytest -q tests/codex tests/integration
  offline-tests:
    needs: source-verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Check scientific source syntax
      run: python -m compileall -q saebase datasets models tasks tests
    - name: Install SAEBase for development
      run: python -m pip install -e ".[dev]"
    - name: Verify minimal development installation
      run: |
        python -m pip check
        saebase-check-env --mode core
        python -c "from saebase.api.sae_loading import load_sae_for_profile; print('lazy SAE imports OK')"
    - name: Check current Stage D support documentation
      run: python scripts/documentation.py support --check
    - name: Check developer documentation links
      run: python scripts/documentation.py --check
    - name: Verify committed Stage D evidence SHA256 and coverage
      run: python -m tasks.benchmark.results.archive --check
    - name: Run full offline tests and collect Python 3.11 branch coverage
      run: |
        python -m pytest -q -n 2 --dist=loadfile --durations=25 \
          --cov=saebase --cov-branch \
          --cov-report=term --cov-report=xml:coverage.xml \
          --cov-report=json:coverage.json
    - name: Upload Python 3.11 coverage baseline
      uses: actions/upload-artifact@v4
      with:
        name: saebase-core-coverage-py311
        path: |
          coverage.xml
          coverage.json
        if-no-files-found: error
    - name: Check CLI
      run: |
        cd "$(mktemp -d)"
        saebase --cfg job
        saebase-check-env --mode core
        python -c "from saebase.api.sae_profiles import list_profiles; print([p.key for p in list_profiles()])"
    - name: Run offline public API example
      run: python -m pytest -q tests/product/test_reference_sae_contracts.py -k nonfinal_position
    - name: Run persistent first experiment and reliability audit
      run: python scripts/examples/first_experiment.py --output "$RUNNER_TEMP/saebase-first-experiment"
    - name: Run external extension demo without model downloads
      run: python scripts/examples/external_providers.py
    - name: Run controlled input cache example
      run: python -m pytest -q tests/product/test_controlled_inputs.py
    - name: Validate installed wheel outside checkout
      run: |
        python -m build --wheel
        python scripts/distribution.py install dist
  analysis-install:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install complete analysis extra in a fresh environment
      run: python -m pip install -e ".[analysis]"
    - name: Verify analysis dependencies and model loading imports
      run: |
        python -m pip check
        saebase-check-env --mode analysis
        python -c "from saebase.api.sae_loading import load_sae_lens; from models.hf_compat import import_sae_lens, import_transformer_lens; import_sae_lens(); import_transformer_lens(); print('analysis imports OK')"
  package:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install build tools
      run: python -m pip install build twine
    - name: Build wheel and source distribution
      run: python -m build
    - name: Verify archives and metadata
      run: |
        python -m twine check dist/*
        python scripts/distribution.py contents dist
    - name: Rebuild wheel from clean source archive
      run: python scripts/distribution.py roundtrip dist
    - name: Verify generic software release candidate without publishing
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        python scripts/release.py prepare             --dist dist --output-dir "$RUNNER_TEMP/software-release"             --source-sha "$SOURCE_SHA"
        python scripts/release.py verify-assets             --dist dist --output-dir "$RUNNER_TEMP/software-release"             --source-sha "$SOURCE_SHA"
    - uses: actions/upload-artifact@v4
      with:
        name: saebase-distributions
        path: dist/*
        if-no-files-found: error
  localization-native:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install SAEBase and original Localize reference
      run: |
        python -m pip install -e ".[dev]"
        python -m pip install "git+https://github.com/OpenSAE/SAE-Input-Localization.git@82b86d7ca20051cc16f7528a0966f4531c4a8eb3"
    - name: Run original-estimator benchmark acceptance
      run: python -m pytest -q tests/product/test_input_localization.py -k native
    - name: Run full Localize benchmark and reliability demo
      run: python -m pytest -q tests/product/test_input_localization.py
  quality:
    needs: source-verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install scoped development quality tools
      run: python -m pip install -e ".[dev,quality]"
    - name: Ruff on adopted modules
      run: ruff check saebase/seed.py datasets/artifacts.py datasets/artifacts.py tasks/benchmark/metrics/registry.py
    - name: Check maintained task adapter formatting
      run: |
        ruff check tasks/generate/conditions.py tasks/capture/explore.py tasks/benchmark/methods/saebench_worker.py
        ruff format --check tasks/generate/conditions.py tasks/capture/explore.py tasks/benchmark/methods/saebench_worker.py
    - name: Mypy on adopted modules
      run: mypy --config-file pyproject.toml saebase/seed.py datasets/artifacts.py datasets/artifacts.py tasks/benchmark/metrics/registry.py
    - name: Enforce lint and formatting on new Python files
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          python scripts/quality.py --base-sha "$PR_BASE_SHA"
        else
          python scripts/quality.py --base-sha HEAD^
        fi
    - name: Validate pre-commit config
      run: pre-commit validate-config .pre-commit-config.yaml
  pinned-research-regression:
    needs: source-verify
    uses: ./.github/workflows/research-regression.yml
  release-validation-required:
    if: ${{ always() }}
    needs:
    - source-verify
    - offline-tests
    - analysis-install
    - package
    - localization-native
    - quality
    - hydra-composition
    - harness-source
    - pinned-research-regression
    runs-on: ubuntu-latest
    steps:
    - name: Require every full validation job to pass
      shell: bash
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import json, os
        results = json.loads(os.environ["JOB_RESULTS"])
        failures = {key: entry["result"] for key, entry in results.items()
                    if entry["result"] != "success"}
        if failures:
            raise SystemExit("Full Release Validation incomplete: " + str(failures))
        print("All full release acceptance jobs succeeded")
        PY
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA to validate
        required: true
        type: string
