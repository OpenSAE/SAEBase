name: Stage C Gemma 9B SAE checkpoint regression

on:
  pull_request:
    paths:
      - 'saebase/sae/registry.py'
      - '.github/workflows/stage-bc-gemma9b-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma9b-native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Gemma Scope SAE loaders
        run: |
          python -m pip install -e '.[analysis]'
          python -m pip check
      - name: Validate actual Gemma Scope 9B PT layer 20 SAE weights
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/phase_bc_cpu_sae.py \
            --sae-key gemma2_9b_pt_scope_resid --layer 20 \
            --output "$RUNNER_TEMP/stage-bc-fixed"
      - name: Upload real SAE checksum and encode/decode acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-bc-gemma9b-pt-l20-corrected
          path: ${{ runner.temp }}/stage-bc-fixed/*.json
          if-no-files-found: warn
          retention-days: 30
