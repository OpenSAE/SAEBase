name: Temporary Research Lab source snapshot refresh
on:
  push:
    branches: [refactor/research-lab-published-records-path-20261030]
    paths: [.github/workflows/atlas-research-records-refresh.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh Code and bilingual Atlas from actual modules
        run: |
          set -euo pipefail
          python harness/core/validate.py
          python harness/knowledge/validate.py
          python harness/code/build.py
          python harness/visualization/export.py
          python harness/visualization/build_pages.py
          python harness/visualization/build_language.py
          python harness/visualization/build_pages.py --check
          python harness/visualization/build_language.py --check
      - name: Commit generated source snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A doc/code harness/visualization
          if ! git diff --cached --quiet; then
            git commit -m "chore(atlas): refresh Code Tree after Research Lab module rename"
            git push origin HEAD:refactor/research-lab-published-records-path-20261030
          fi
