# Purpose and main function: inspection of interfaces, information and scientific functions within the project as implemented by change.
# Scope of application: delivery, removal requests and manual daily inspections.
name: CI
permissions:
  contents: read
concurrency:
  group: lightweight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.route.outputs.harness }}
      atlas: ${{ steps.route.outputs.atlas }}
      product: ${{ steps.route.outputs.product }}
      ci_policy: ${{ steps.route.outputs.ci_policy }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - id: route
      name: Select all affected lightweight checks
      shell: bash
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        BASE="${PR_BASE:-${PUSH_BASE:-}}"
        HEAD="$(git rev-parse HEAD)"
        python scripts/quality.py select --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"
  quality:
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install lightweight CI inspection tools
      run: python -m pip install -q "ruff==0.15.22" "PyYAML>=6" "pytest>=7"
    - name: Verify Python syntax and new-file formatting
      shell: bash
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        BASE="${PR_BASE:-${PUSH_BASE:-}}"
        if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}"; then
          python scripts/quality.py --base-sha "$BASE"
        else
          echo "No trustworthy baseline; run conservative source checks."
        fi
        python -m compileall -q scripts
    - name: Check configuration paths, task keys and documentation
      run: python -m pytest -q tests/test_configuration.py
    - name: Check current documentation links
      run: python scripts/documentation.py --check
    - name: Validate CI routing, security and release contracts
      run: python -m pytest -q tests/product/test_ci_select_checks.py tests/product/test_software_release_workflow_paths.py tests/product/distribution/test_python_quality_autofmt.py
  harness-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.harness == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install local interface check tools
      run: python -m pip install -q "PyYAML>=6" "pytest>=7"
    - name: Check local integration interfaces
      run: python -m pytest -q tests/integration/test_central_boundary.py -k 'not project_contains_inputs'
  atlas-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.atlas == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install project input check tools
      run: python -m pip install -q "PyYAML>=6" "pytest>=7"
    - name: Check declared project inputs
      run: python -m pytest -q tests/integration/test_central_boundary.py -k project_contains_inputs
  product-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install core and model backend test dependencies
      run: python -m pip install -e ".[dev]" "transformer-lens==3.2.1" "sae-lens==6.55.1"
    - name: Run bounded Registry, Runtime and config regression
      run: |
        python -m pip check
        python -m pytest -q tests/product/test_sae_model_registry.py tests/product/test_hydra_first_run.py tests/product/test_device_selection.py
        python -m pytest -q tests/product/precheck/test_api_boundary.py tests/product/precheck/test_auto_preparation.py tests/product/precheck/test_component_matrix.py tests/product/precheck/test_dataset_checks.py tests/product/precheck/test_model_configs.py tests/product/precheck/test_model_families.py tests/product/precheck/test_model_sae_sites.py tests/product/precheck/test_modes.py tests/product/precheck/test_worker.py
        python -m pytest -q tests/product/test_current_task_contracts.py tests/product/test_experiment_results.py tests/product/test_activation_store.py tests/product/test_feature_interventions.py tests/product/benchmarks/test_benchmark_execution.py tests/product/benchmarks/test_reliability_bootstrap.py
        python -m pytest -q tests/product/runtime/test_task_owned_workflows.py tests/product/capture/test_capture_whitening.py tests/product/capture/test_capture_continuation.py tests/product/benchmarks/test_fixed_dataset_cohort.py tests/product/benchmarks/test_public_dataset_sources.py tests/product/capture/test_capture_configuration.py tests/product/capture/test_neuronpedia_capture.py tests/product/runtime/test_execution_lifecycle.py tests/product/benchmarks/test_benchmark_launch.py tests/product/distribution/test_installed_distribution.py
  ci-required:
    if: ${{ always() }}
    needs:
    - changes
    - quality
    - harness-targeted
    - atlas-targeted
    - product-targeted
    runs-on: ubuntu-latest
    steps:
    - name: Reject missing or failed required scopes
      shell: bash
      env:
        CHANGE_RESULT: ${{ needs.changes.result }}
        QUALITY_RESULT: ${{ needs.quality.result }}
        NEED_HARNESS: ${{ needs.changes.outputs.harness }}
        HARNESS_RESULT: ${{ needs.harness-targeted.result }}
        NEED_ATLAS: ${{ needs.changes.outputs.atlas }}
        ATLAS_RESULT: ${{ needs.atlas-targeted.result }}
        NEED_PRODUCT: ${{ needs.changes.outputs.product }}
        PRODUCT_RESULT: ${{ needs.product-targeted.result }}
      run: |
        set -euo pipefail
        test "$CHANGE_RESULT" = success
        test "$QUALITY_RESULT" = success
        for group in HARNESS ATLAS PRODUCT; do
          need_key="NEED_$group"
          result_key="${group}_RESULT"
          if [[ "${!need_key}" == true ]]; then
            test "${!result_key}" = success
          fi
        done
        echo "All selected lightweight checks passed." >> "$GITHUB_STEP_SUMMARY"
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
