name: CI

# Both PRs and frequent main pushes get the same lightweight, diff-aware gate.
# Complete dependency installs, full coverage, wheels, Docker, and scientific
# integrations belong to the manual, exact-SHA Release Validation workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.route.outputs.harness }}
      atlas: ${{ steps.route.outputs.atlas }}
      product: ${{ steps.route.outputs.product }}
      ci_policy: ${{ steps.route.outputs.ci_policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: route
        name: Select all affected lightweight checks
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-${PUSH_BASE:-}}"
          HEAD="$(git rev-parse HEAD)"
          python harness/github/ci/select_checks.py --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight CI inspection tools
        run: python -m pip install -q "ruff>=0.12,<0.16" "PyYAML>=6" "pytest>=7"
      - name: Verify Python syntax and new-file formatting
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}"; then
            python harness/github/work_test/check_wp21_added_python_quality.py --base-sha "$BASE"
          else
            echo "No trustworthy baseline; run conservative source checks."
            python -m compileall -q harness
          fi
          python -m compileall -q harness/github/ci
      - name: Validate CI routing, security and release contracts
        run: |
          python -m pytest -q             harness/github/work_test/test_ci_select_checks.py             harness/github/work_test/test_ci_lanes.py             harness/github/work_test/test_software_release_workflow_paths.py             harness/github/work_test/test_repository_architecture.py

  harness-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.harness == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest PyYAML
      - name: Validate frozen versioned Harness archives
        run: |
          python -m harness.github.archive check
          python -m pytest -q harness/github/work_test/test_archive_lifecycle.py
      - name: Run bounded Harness and Contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             harness/github/work_test/test_universal_task_contracts.py             harness/github/work_test/test_contract_acceptance.py
          if test -f harness/github/work_test/test_human_check.py; then
            python -m pytest -q harness/github/work_test/test_human_check.py
          fi

  atlas-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.atlas == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest PyYAML
      - name: Validate authority graph and interactive Atlas
        run: |
          python harness/core/validate.py
          python harness/knowledge/validate.py
          node --check harness/visualization/app.js
          node harness/github/work_test/test_atlas_deep_navigation.cjs
          node harness/github/work_test/test_atlas_global_search.cjs
          node harness/github/work_test/test_atlas_hc_review_navigation.cjs

  product-targeted:
    needs: changes
    if: ${{ needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and test dependencies (not full analysis)
        run: python -m pip install -e ".[dev]"
      - name: Run bounded Registry, Runtime and config regression
        run: |
          python -m pip check
          python -m pytest -q             harness/github/work_test/test_sae_model_registry.py             harness/github/work_test/test_hydra_first_run.py

  ci-required:
    if: ${{ always() }}
    needs: [changes, quality, harness-targeted, atlas-targeted, product-targeted]
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing or failed required scopes
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NEED_HARNESS: ${{ needs.changes.outputs.harness }}
          HARNESS_RESULT: ${{ needs.harness-targeted.result }}
          NEED_ATLAS: ${{ needs.changes.outputs.atlas }}
          ATLAS_RESULT: ${{ needs.atlas-targeted.result }}
          NEED_PRODUCT: ${{ needs.changes.outputs.product }}
          PRODUCT_RESULT: ${{ needs.product-targeted.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          test "$QUALITY_RESULT" = success
          for group in HARNESS ATLAS PRODUCT; do
            need_key="NEED_$group"
            result_key="${group}_RESULT"
            if [[ "${!need_key}" == true ]]; then
              test "${!result_key}" = success
            fi
          done
          echo "All selected lightweight checks passed." >> "$GITHUB_STEP_SUMMARY"
