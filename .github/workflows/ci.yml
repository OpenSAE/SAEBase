name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SAEBase for development
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check CLI
        run: |
          cd "$(mktemp -d)"
          saebase --list
          saebase-check-env --mode core
          python -m saebase.sae.verify_registry --list
      - name: Run offline public API example
        run: python examples/05_public_api_offline.py
      - name: Validate installed wheel outside checkout
        run: |
          python -m build --wheel
          python scripts/check_installed_wheel.py dist

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify archives and metadata
        run: |
          python -m twine check dist/*
          python scripts/verify_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: saebase-distributions
          path: dist/*
          if-no-files-found: error
