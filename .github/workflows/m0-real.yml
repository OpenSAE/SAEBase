name: Real Pythia checkpoint acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-pythia:
    # A deliberate [m0-real] commit triggers a one-time check. Other pushes do not
    # download model weights; the workflow can also be run manually from Actions.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m0-real]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real-model analysis environment
        run: python -m pip install -e '.[analysis]'
      - name: Verify installed packages and runtime
        run: |
          python -m pip check
          saebase-check-env --mode analysis
      - name: Real Pythia-70M / SAE / prompt / identity / ablation acceptance
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          DEVICE: cpu
          N_GENERATE: '120'
          MIN_KEPT: '5'
          N_PROMPTS: '3'
          OUT_DIR: '${{ runner.temp }}/saebase-m0'
          DATA_DIR: '${{ runner.temp }}/saebase-m0/data'
        run: bash scripts/m0_real_smoke.sh
      - name: Preserve real evaluation reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m0-reference
          path: '${{ runner.temp }}/saebase-m0'
          if-no-files-found: warn
          retention-days: 14
