name: Deploy centrally published Atlas snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing central publication without rebuilding
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          record = json.loads(Path("atlas/publication.json").read_text())
          assert record["project_id"] == "saebase" and record["status"] == "reviewed"
          PYTHON
          cd atlas
          sha256sum --check SHA256SUMS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
