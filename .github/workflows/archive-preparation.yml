name: Archive Preparation (read-only)
permissions:
  contents: read
concurrency:
  group: harness-archive-prepare-${{ inputs.next_version }}
  cancel-in-progress: false
jobs:
  archive-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Use central archive management
      run: |-
        echo "BLOCKED: management archive preparation is owned by ResearchHarness. Use the explicit central history interface; this project never creates a second archive manager." >&2
        exit 1
'on':
  workflow_dispatch:
    inputs:
      closing_version:
        description: Version being frozen into archive, e.g. 0.6.5
        required: true
        type: string
      next_version:
        description: Upcoming release, matching pyproject.toml
        required: true
        type: string
