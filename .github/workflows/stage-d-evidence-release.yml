name: Stage D compact evidence archive (historical, manual only)

# The immutable stage-d-evidence-20261016 GitHub Release is already published.
# Never derive evidence publication authority from lightweight PR/main CI.
# Historical assets and their existing tag remain untouched.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the published Stage D evidence archive
        run: |
          echo "Stage D compact evidence was published at stage-d-evidence-20261016."
          echo "No automatic republishing or asset replacement is permitted."
          echo "Full new research evidence needs its own reviewed release workflow."
