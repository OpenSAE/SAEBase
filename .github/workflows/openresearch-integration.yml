name: OpenResearch integration source checks
on:
  push:
    branches: [sync-openresearch-harness-20261027]
  pull_request:
    paths:
      - "dlbase/**"
      - "datasets/**"
      - "models/**"
      - "tasks/**"
      - "harness/**"
      - ".cursor/**"
      - "doc/**"
      - "conf/**"
      - "tests/test_openresearch_integration.py"
      - ".github/workflows/openresearch-integration.yml"
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and governance
        run: python .cursor/hooks/validate_repo.py --full
      - name: Run integration structure tests
        run: |
          python -m pip install "pytest>=7,<10"
          python -m pytest -q tests/test_openresearch_integration.py
