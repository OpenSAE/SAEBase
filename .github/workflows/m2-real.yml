name: Real M2 batch interventions acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m2-pythia:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2-real]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real-model analysis dependencies
        run: python -m pip install -e '.[analysis]'
      - name: Compare real M2 batch interventions against M0 and M1 cache
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/m2_real_smoke.py \
            --m0-reference tests/fixtures/m0_reference_public.json \
            --cache-root "$RUNNER_TEMP/m2-cache" \
            --output "$RUNNER_TEMP/m2-results/m2_reference.json"
      - name: Archive real M2 reference and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m2-reference
          path: ${{ runner.temp }}/m2-results/
          if-no-files-found: warn
          retention-days: 14
