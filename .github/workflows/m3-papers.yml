name: M3 original SAR and RSS estimator validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'saebase/benchmarks/**'
      - 'tests/test_m3_paper_adapters.py'
      - '.github/workflows/m3-papers.yml'

permissions:
  contents: read

jobs:
  paper-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpenSAE/SAE-Behavioral-Compositionality
          path: originals/sar
      - uses: actions/checkout@v7
        with:
          repository: OpenSAE/Redistribution-Sensitivity-Score
          path: originals/rss
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install SAEBase minimal tests
        run: python -m pip install -e '.[dev]'
      - name: Execute original estimator parity checks
        env:
          SAEBASE_SAR_SOURCE: originals/sar/sar.py
          SAEBASE_RSS_SOURCE: originals/rss/rss.py
        run: python -m pytest -q tests/test_phase_c_reference_contract.py tests/test_m3_paper_adapters.py
