name: Research Lab CPU
on:
  pull_request:
    paths:
      - "apps/research-lab/**"
      - ".github/workflows/research-lab-cpu.yml"
      - "conf/coverage/stage_d_evidence/**"
  push:
    branches: [main]
    paths:
      - "apps/research-lab/**"
      - ".github/workflows/research-lab-cpu.yml"
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install only the lightweight API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/research-lab/requirements.txt pytest httpx
      - name: Parse Python and JavaScript
        run: |
          python -m compileall -q apps/research-lab/backend apps/research-lab/tests
          node --check apps/research-lab/frontend/app.js
      - name: Run offline tests against committed real evidence
        run: python -m pytest -q apps/research-lab/tests/test_platform.py
