name: Stage C public SAE source metadata

on:
  pull_request:
    paths:
      - 'scripts/phase_bc_source_metadata.py'
      - '.github/workflows/stage-bc-source-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SAEBase and lightweight HF metadata client
        run: |
          python -m pip install -e .
          python -m pip install 'huggingface-hub>=0.23'
      - name: Probe 48 public SAE source objects without downloading model weights
        id: probe
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/phase_bc_source_metadata.py --output "$RUNNER_TEMP/stage-bc-source.json"
      - name: Upload exact file presence and unresolved metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-bc-48-source-metadata
          path: ${{ runner.temp }}/stage-bc-source.json
          if-no-files-found: warn
          retention-days: 30
      - name: Show source results truthfully
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"stage-bc-source.json"
          if not path.is_file():
              raise SystemExit("Missing source metadata; inspect earlier step")
          data=json.loads(path.read_text())
          summary=f"{data['found']} found, {data['unresolved']} unresolved, {data['failed']} failed among {data['total']} source metadata checks"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Stage B/C source metadata: {summary}. A source HEAD response is not genuine SAE weight acceptance.\n")
          PY
