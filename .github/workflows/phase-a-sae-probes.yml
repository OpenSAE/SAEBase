name: Phase A genuine SAE-only checkpoint probes

on:
  pull_request:
    paths:
      - 'scripts/phase_a_sae_only.py'
      - 'saebase/sae/**'
      - '.github/workflows/phase-a-sae-probes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sae-weight-probe:
    name: SAE-only weight probe (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        model: [gemma270m, gemma1b, gemma2_2b, qwen35_2b, qwen3_8b, llama31_8b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original checkpoint loader dependencies
        run: |
          python -m pip install -e '.[analysis]'
          python -m pip check
      - name: Load and checksum pretrained SAE weights (not the base language model)
        id: probe
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/phase_a_sae_only.py --model "${{ matrix.model }}" \
            --output "$RUNNER_TEMP/phase-a"
      - name: Preserve loaded SAE weight evidence or exact failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-sae-only-${{ matrix.model }}
          path: ${{ runner.temp }}/phase-a/*.json
          if-no-files-found: warn
          retention-days: 30
