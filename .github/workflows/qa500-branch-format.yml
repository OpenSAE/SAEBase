name: QA500 one-time source formatting
on:
  push:
    branches: [feat/qa-evaluation-500-v1]
    paths:
      - "datasets/qa_*.py"
      - "harness/github_work_test/test_qa*.py"
      - ".github/workflows/qa500-branch-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and fix QA Python sources
        run: |
          python -m pip install "ruff>=0.12,<0.16"
          python -m ruff check --fix datasets/qa_*.py harness/github_work_test/test_qa*.py
          python -m ruff format datasets/qa_*.py harness/github_work_test/test_qa*.py
      - name: Commit only formatting
        run: |
          if ! git diff --quiet -- datasets/qa_*.py harness/github_work_test/test_qa*.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- datasets/qa_*.py harness/github_work_test/test_qa*.py
            git commit -m "style(qa): normalize all WP22 source formatting"
            git push origin HEAD:feat/qa-evaluation-500-v1
          fi
