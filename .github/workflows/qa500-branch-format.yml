name: QA500 branch formatting

on:
  push:
    branches:
      - feat/qa-evaluation-500-v1
    paths:
      - "datasets/qa_*.py"
      - "harness/github_work_test/test_qa*.py"
      - ".github/workflows/qa500-branch-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff autoformat newly introduced QA500 Python only
        run: |
          python -m pip install "ruff>=0.12,<0.16"
          python -m ruff check --fix datasets/qa_*.py harness/github_work_test/test_qa*.py
          python -m ruff format datasets/qa_*.py harness/github_work_test/test_qa*.py
      - name: Commit generated formatting to the feature branch
        run: |
          if ! git diff --quiet -- datasets/qa_*.py harness/github_work_test/test_qa*.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- datasets/qa_*.py harness/github_work_test/test_qa*.py
            git commit -m "style(qa): apply CI-compatible Ruff formatting"
            git push origin HEAD:feat/qa-evaluation-500-v1
          fi
