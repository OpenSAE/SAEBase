name: Real M3 Pythia benchmark acceptance

# Historical checkpoint acceptance is explicitly opt-in.
# PR regression is covered by CI and pinned research-regression.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3-pythia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real analysis dependencies
        run: python -m pip install -e '.[analysis]'
      - name: Run bounded real Pythia M1-M2-M3 pipeline
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          saebase-benchmark --config conf/benchmark/pythia_benchmark_smoke.json --dry-run
          saebase-benchmark --config conf/benchmark/pythia_benchmark_smoke.json --real --output "$RUNNER_TEMP/m3"
          saebase-benchmark --config conf/benchmark/pythia_benchmark_smoke.json --real --resume --output "$RUNNER_TEMP/m3"
          saebase-benchmark --config conf/benchmark/pythia_benchmark_smoke.json --report-only --output "$RUNNER_TEMP/m3"
          python - <<'PY'
          from pathlib import Path
          from saebase.benchmarks import load_config
          from saebase.benchmarks.results import read_metrics
          import os
          cfg=load_config('conf/benchmark/pythia_benchmark_smoke.json')
          root=Path(os.environ['RUNNER_TEMP'])/'m3'/cfg.run_id
          rows=read_metrics(root,cfg.run_id)
          assert len(rows)==7, len(rows)
          assert all(row['status']=='completed' for row in rows), rows
          # Same real checkpoint, token IDs and site as the frozen M0 reference.
          # M3 must preserve measured L0 and reconstruction MSE, not merely
          # produce finite but arbitrary scores.
          import json
          ref=json.loads(Path('harness/github/work_test/fixtures/m0_reference_public.json').read_text())
          original=next(x for x in ref['samples'] if x['token_ids']==[40587,37083,15458])
          by_id={r['metric_id']:r['value'] for r in rows if r['condition_id'] is None}
          assert by_id['core.l0']==original['codes_l0']
          assert abs(by_id['core.reconstruction_mse']-original['reconstruction_mse'])<0.02
          assert (root/'report.html').exists()
          print('Verified M3 real Pythia SAE benchmark:',len(rows),'metric rows')
          PY
      - name: Save Pythia M3 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saebase-m3-real-pythia
          path: ${{ runner.temp }}/m3/
          if-no-files-found: warn
          retention-days: 14
