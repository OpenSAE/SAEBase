name: SAEBase v0.6.0 Approved Release Dispatch (retired auto-dispatch)

# Historical version-bound automation is deliberately manual and non-publishing.
# A lightweight push-to-main CI success is NOT release authorization.
# Use release-validation.yml with an exact source SHA, then software-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the supported, manual release workflow
        run: |
          echo "This historical automatic release dispatcher is disabled."
          echo "Run Release Validation for a chosen current-main SHA."
          echo "After all required jobs pass, use Software Release with explicit confirmation."
