name: Feature request
description: Suggest an improvement to SAEBase infrastructure
body:
  - type: textarea
    id: use_case
    attributes:
      label: Research or engineering use case
      description: What SAE evaluation, analysis, or intervention task needs this feature?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Suggested interface or behavior
      description: Describe the smallest practical change and an example invocation if possible.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and related work
      description: Links to related issues, upstream projects, protocols, or existing APIs.
    validations:
      required: false
