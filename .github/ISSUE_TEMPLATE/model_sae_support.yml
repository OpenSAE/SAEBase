name: Model / SAE checkpoint support
description: Request support for a model, SAE architecture, checkpoint or activation site
body:
  - type: input
    id: model_source
    attributes:
      label: Model repository and revision
      description: Exact model source (for example, a Hugging Face repository) and revision.
      placeholder: organization/model-id at revision
    validations:
      required: true
  - type: input
    id: sae_source
    attributes:
      label: Original SAE checkpoint source and revision
      description: Provide the checkpoint repository, original author and exact release or file when known.
    validations:
      required: true
  - type: textarea
    id: site_and_architecture
    attributes:
      label: Activation site and SAE conventions
      description: List layer(s), hook name, SAE architecture, d_in/d_sae, normalization and decoder details. Include Base/Instruct compatibility.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification performed so far
      description: Separate registry setup, checkpoint encode/decode, actual model-SAE pair tests, and downstream intervention. Include hardware, dtype and reproducible commands.
    validations:
      required: false
  - type: textarea
    id: provenance
    attributes:
      label: Original sources, access and licensing
      description: Link the source code, checkpoint card, license and any gated access requirements.
    validations:
      required: true
