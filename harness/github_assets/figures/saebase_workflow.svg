<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="630" viewBox="0 0 1290 630" role="img" aria-labelledby="title desc">
  <title id="title">SAEBase research workflow</title>
  <desc id="desc">Models and SAEs plus versioned inputs lead to activation capture, an activation store and SAE encoding. Reconstruction and feature interventions are evaluated with benchmarks and reliability checks, followed by provenance and reports.</desc>
