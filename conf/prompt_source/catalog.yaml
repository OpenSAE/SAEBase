# 目的和主要功能：保存提示来源的公共默认值及具名预设。
# 适用范围：Hydra 组件选择，以及 conf.load_group 的直接读取。
defaults:
  input_format: text
presets:
  arc_challenge:
    name: ARCChallenge
    data_path: ${paths.data_dir}/ARCChallenge
  bbh:
    name: BBH
    data_path: ${paths.data_dir}/BBH
    prepare:
      n_generate: 80
      min_kept: 10
      seed: 0
      source_path: /workspace/data/BBH
  counterfact:
    name: CounterFact
    data_path: ${paths.data_dir}/CounterFact
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
  gpqa_extended:
    name: GPQAExtended
    data_path: ${paths.data_dir}/GPQAExtended
  greater_than:
    name: GreaterThan
    data_path: ${paths.data_dir}/GreaterThan
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
  ioi:
    name: IOI
    data_path: ${paths.data_dir}/IOI
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
  livecodebench:
    name: LiveCodeBench
    data_path: ${paths.data_dir}/LiveCodeBench
  math500:
    name: MATH500
    data_path: ${paths.data_dir}/MATH500
  medqa:
    name: MedQA
    data_path: ${paths.data_dir}/MedQA
  mmlu_pro:
    name: MMLUPro
    data_path: ${paths.data_dir}/MMLUPro
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
      split: test
      categories: all
      n_shot: 0
      scoring: direct
      max_prompt_tokens: 2048
      drop_na_options: true
      balance_per_category: false
      source_path: /workspace/data/MMLU-Pro
      hf_name: TIGER-Lab/MMLU-Pro
  simple_copying:
    name: SimpleCopying
    data_path: ${paths.data_dir}/SimpleCopying
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
  subject_verb_agreement:
    name: SubjectVerbAgreement
    data_path: ${paths.data_dir}/SubjectVerbAgreement
    prepare:
      n_generate: 300
      min_kept: 20
      seed: 0
