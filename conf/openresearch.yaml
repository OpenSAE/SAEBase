defaults:
  - dataset: ioi
  - model: openresearch_gemma2_2b_base
      - paths: default
  - task: capture
  - experiment: default
  - _self_

# Random seed for LLM SAE runs
seed: 42

# Leaf directory name: ${experiment.sub_name}_${seed} (e.g. basic_1). Same path overwrites previous run.
exp_run_leaf: ${experiment.sub_name}_${seed}

hydra:
  run:
    dir: ${paths.root}/experiment/${dataset.name}/${model.name}/${task.path}/${exp_run_leaf}
  sweep:
    dir: ${paths.root}/experiment/${dataset.name}/${model.name}/${task.path}/_sweeps/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
