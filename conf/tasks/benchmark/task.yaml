    - core.l0
    - core.reconstruction_mse
    - core.fvu
    - core.explained_variance
    - intervention.logit_delta_l2
    - intervention.kl_baseline_to_edited
    conditions:
    - name: identity
      operation: identity
    - name: reconstruction
      operation: reconstruction
    seed: 0
    max_measurements: 16
    max_activation_rows: 16
    tolerance: 0.01
    sample_batch: 1
  m4_ground_truth:
    schema: saebase.m4.audit.config.v1
    evaluation_seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    bootstrap_replicates: 128
    confidence: 0.95
    sample_sizes:
    - 32
    - 64
    - 128
    top_k: 1
    training_seed: null
    metric_ids: []
