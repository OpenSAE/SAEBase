# 目的和主要功能：保存模型的公共默认值及具名预设。
# 适用范围：Hydra 组件选择，以及 conf.load_group 的直接读取。
defaults:
  device: auto
presets:
  gemma1b:
    name: gemma1b
    pretrained_name: google/gemma-3-1b-pt
    family: gemma
    sae_profiles:
    - gemma1b_pt_l25_transfer_big
    - gemma1b_pt_l25_transfer_small
    - gemma1b_scope_resid
    default_saes:
    - gemma1b_scope_resid
    default_layers:
      gemma1b_scope_resid: 13
  gemma1b_it:
    name: gemma1b_it
    pretrained_name: google/gemma-3-1b-it
    family: gemma
    sae_profiles:
    - gemma1b_it_l25_native_big
    default_saes:
    - gemma1b_it_l25_native_big
