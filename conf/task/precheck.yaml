# @package _global_
# Setup only prepares assets; Precheck owns every real test.
task:
  name: precheck
  path: precheck
  execute: false
  mode: sae             # sae | task | all
  sae_list: default     # default | all | list of Model-owned SAE keys
  check_tasks: []       # subset of capture/intervene/generate/circuits/explain/benchmark/train
  prompt: "The capital of France is"
  device: cpu
  auto_setup: true
  allow_compute: false
  allow_gpu: false
  allow_network: false
  allow_install: false
  allow_download: false
  allow_native: false
  max_download_bytes: 0
  max_seconds: 120
  max_samples: 2
  max_tokens: 32
